version: '3.8'

services:
  # === 1. PHP 專用的資料庫 ===
  db:
    image: mariadb:10.11
    container_name: mariadb_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gapure_dolly
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # === 2. Java 專案 (Tomcat) 專用的獨立資料庫 ===
  tomcat_db:
    image: mariadb:10.11
    container_name: tomcat_db_server
    restart: always
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: axe_project_db
      MYSQL_USER: axe_user
      MYSQL_PASSWORD: axe_1234
    volumes:
      - tomcat_db_data:/var/lib/mysql
      - ./axe_project.sql:/docker-entrypoint-initdb.d/axe_project.sql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # === 3. 獨立的 PHP-FPM 5.6 Alpine 容器 ===
  php_app:
    build: ./php           # 👈 指向獨立的 php/Dockerfile
    container_name: php_56_fpm
    restart: always
    depends_on:
      - db
    volumes:
      - wp_data:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  # === 4. Nginx 反向代理（統一調度 PHP-FPM 與 Tomcat） ===
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
    depends_on:
      - php_app
      - tomcat
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - wp_data:/var/www/html:ro  # 👈 Nginx 必須看的到 PHP 的靜態檔案
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  # === 5. Tomcat 9 (JDK 8) ===
  tomcat:
    build: ./tomcat        # 👈 指向獨立的 tomcat/Dockerfile
    container_name: tomcat_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - tomcat_db
    extra_hosts:
      - "localhost:127.0.0.1"
      - "mariadb:127.0.0.1"
    environment:
      - TZ=Asia/Taipei
      - JAVA_OPTS=-Duser.timezone=Asia/Taipei -Xms128m -Xmx512m
   # 💡 【核心：方案 A 精髓】把虛擬機本機剛才放的 war 檔，即時掛載進 Tomcat 容器
    volumes:
      - /root/build-assets/axe_point_system.war:/usr/local/tomcat/webapps/ROOT.war

volumes:
  db_data:
  tomcat_db_data:
  wp_data:

