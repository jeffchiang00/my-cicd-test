user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # 【服務 A】連接埠 80：CodeIgniter 2 主系統 + 獨立子網頁 /dolly
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # ⚠️ 在 Nginx 容器內部，掛載的網頁根目錄路徑為 /var/www/html
        root /var/www/html;
        index index.php index.html index.htm;

        server_name 192.168.0.109;

        # 1. CodeIgniter 2 主路由 
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # 2. 獨立子網頁 /dolly 路由
        location /dolly {
            alias /var/www/html/dolly;
            try_files $uri $uri/ @dolly;

            # 針對 /dolly 目錄下的 PHP 檔案處理
            location ~ \.php$ {
                fastcgi_pass php_app:9000; # 👈 精准對接 PHP 5.6 FPM 容器
                fastcgi_index index.php;
                
                # 取代舊有 snippets 的標準 FastCGI 設定
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename; 
                fastcgi_param PATH_INFO $fastcgi_path_info;
            }
        }

        # /dolly 的 URL 漂亮網址重寫規則
        location @dolly {
            rewrite /dolly/(.*)$ /dolly/index.php?/$1 last;
        }

        # 3. 主系統的 PHP 檔案處理
        location ~ \.php$ {
            fastcgi_pass php_app:9000; # 👈 精准對接 PHP 5.6 FPM 容器
            fastcgi_index index.php;
            
            # 標準 FastCGI 設定
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # =========================================================================
    # 【服務 B】連接埠 81：WASH 點數系統 (Tomcat 9 ROOT 專用)
    # =========================================================================
    server {
        listen 81;
        server_name localhost;

        # 當使用者只輸入 http://192.168.0.109:81 時，自動跳轉到登入頁
        location = / {
            return 301 $scheme://$http_host/main/login.jsp;
        }

        # 100% 原封不動送交 Tomcat 容器的 8080 根目錄
        location / {
            proxy_pass http://tomcat:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 完美支援 Tomcat 內部的 Redirect 跳轉
            proxy_redirect default;
        }
    }
}

