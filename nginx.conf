user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # 【服務 A】連接埠 80：CodeIgniter 2 主系統 (入口移至 dolly)
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # 💡 將網頁根目錄直接對準 dolly，消滅 403 Forbidden！
        #root /var/www/html/dolly;
	# 💡 修改回標準根目錄，與 PHP 容器內部 100% 對齊！
        root /var/www/html;
        index index.php index.html index.htm;

        server_name 192.168.0.109;

        # 修正 CodeIgniter 2 漂亮網址路由
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # 精準對接 PHP 5.6 FPM 容器處理 PHP 檔案
        location ~ \.php$ {
            fastcgi_pass php_app:9000;
            fastcgi_index index.php;
            
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # =========================================================================
    # 【服務 B】連接埠 81：WASH 點數系統 (Tomcat 9 ROOT 專用)
    # =========================================================================
    server {
        listen 81;
        server_name localhost;

        location = / {
            return 301 $scheme://$http_host/main/login.jsp;
        }

        # 100% 原封不動送交 Tomcat 容器
        location / {
            proxy_pass http://tomcat:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect default;
        }
    }
}

