name: 雙系統本地虛擬機推演流水線 (金鑰通關版)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出 Git 最新程式碼
        uses: actions/checkout@v3

      # === 【WordPress PHP 區】改用金鑰外送檔案 ===
      - name: 2. 點對點熱同步 WordPress PHP 網頁檔案
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wordpress-src/*"
          target: "/var/lib/docker/volumes/my-project_wp_data/_data/wp-content/"
          strip_components: 1

      # === 遠端虛擬機執行區 ===
      - name: 3. SSH 登入虛擬機，執行 Nginx 路由重載
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "🔄 偵測到網頁設計師更新 PHP 檔案，執行 Nginx 熱重載..."
            if [ \$(docker ps -q -f name=nginx_proxy) ]; then
                docker compose exec -T nginx nginx -s reload
            fi
            echo "🎉 [Success] 本地虛擬機自動化網頁部署成功！"
