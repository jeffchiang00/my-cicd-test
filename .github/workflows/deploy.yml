name: 雙系統本地虛擬機推演流水線

on:
  push:
    branches:
      - main # 當我們 git push 時立刻觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出 Git 最新程式碼
        uses: actions/checkout@v3

      # === 【WordPress PHP 區】將最新 PHP 網頁檔案精準外送到虛擬機 ===
      - name: 2. 點對點熱同步 WordPress PHP 網頁檔案
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # ⭕ 關鍵：對齊 ngrok 的隨機端口
          source: "wordpress-src/**/*"
          target: "/var/lib/docker/volumes/my-project_wp_data/_data/wp-content/"
          strip_components: 1

      # === 遠端虛擬機執行區 ===
      - name: 3. SSH 登入虛擬機，執行 Nginx 路由重載
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # ⭕ 關鍵：對齊 ngrok 的隨機端口
          script: |
            echo "🔄 偵測到網頁設計師更新 PHP 檔案，執行 Nginx 熱重載..."
            # 遠端命令虛擬機內的 nginx 重載設定，達到 0 秒中斷熱更新
            docker compose exec -T nginx nginx -s reload
            echo "🎉 [Success] 本地虛擬機自動化網頁部署成功！"
