name: 雙系統本地虛擬機推演流水線 (地表最強自建 Runner 版)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. 檢出 Git 最新程式碼
        uses: actions/checkout@v3

      - name: 2. 本地直接熱同步 CodeIgniter 專案原始碼
        run: |
          echo "🚚 1. 確保目標持久化目錄空間存在..."
          sudo mkdir -p /var/lib/docker/volumes/my-project_wp_data/_data/

          # 💡 【核心修正】因為自建 Runner 會把程式碼下載在當前工作目錄的 wordpress-src 下
          # 我們用 -a 精準把當前目錄下的 wordpress-src 攤平複製到 Docker Volume 根目錄中
          echo "🚚 2. 將自建 Runner 下的 wordpress-src 核心程式碼平鋪投放進去..."
          if [ -d "wordpress-src" ]; then
              sudo cp -a wordpress-src/. /var/lib/docker/volumes/my-project_wp_data/_data/
          else
              echo "⚠️ 警告：找不到 wordpress-src 資料夾，請確認您的 Git 倉庫結構！"
          fi

          echo "🚚 3. 精準建立獨立的小寫 dolly 目錄..."
          sudo mkdir -p /var/lib/docker/volumes/my-project_wp_data/_data/dolly

          echo "🚚 4. 將獨立的 dolly 原始碼平鋪投放進去..."
          if [ -d "dolly" ]; then
              sudo cp -a dolly/. /var/lib/docker/volumes/my-project_wp_data/_data/dolly/
          fi

          echo "🚚 5. 強制刷新網頁目錄讀寫權限 (FPM/Nginx 預設 33:33)..."
          sudo chown -R 33:33 /var/lib/docker/volumes/my-project_wp_data/_data/
      - name: 3. 執行本機 Docker 獨立編譯與重載
        run: |
          echo "🔄 目前工作目錄在: $(pwd)"
          echo "🔍 檢查目前拉下來的最新環境設定檔:"
          ls -la
          
          echo "🔄 核心動能：直接使用當前目錄剛檢出的 Docker 結構進行編譯啟動..."
          # 💡 因為結構完全一致，直接在當前目錄執行 up -d 即可！
          sudo docker compose up -d --build --remove-orphans
          
          echo "🎉 [Success] 純 PHP-FPM 5.6 與 Tomcat 9 全新多容器環境同步刷新完
