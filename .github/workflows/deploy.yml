name: 雙系統本地虛擬機推演流水線 (地表最強自建 Runner 版)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. 檢出 Git 最新程式碼
        uses: actions/checkout@v3

      - name: 2. 本地直接熱同步 WordPress 與 獨立 PHP 專案
        run: |
          echo "🚚 1. 建立目標持久化目錄空間..."
          sudo mkdir -p /var/lib/docker/volumes/my-project_wp_data/_data/
          
          echo "🚚 2. 使用 -a 參數精準同步 WordPress 核心檔案（包含隱藏的 .htaccess）..."
          sudo cp -a wordpress-src/. /var/lib/docker/volumes/my-project_wp_data/_data/
          
          echo "🚚 3. 精準建立獨立的小寫 dolly 目錄..."
          sudo mkdir -p /var/lib/docker/volumes/my-project_wp_data/_data/dolly
          
          echo "🚚 4. 將 Mac 端獨立的 dolly 原始碼平鋪投放進去..."
          if [ -d "dolly" ]; then
              sudo cp -a dolly/. /var/lib/docker/volumes/my-project_wp_data/_data/dolly/
          fi
          
          echo "🚚 5. 強制刷新最高網頁讀寫權限..."
          sudo chown -R 33:33 /var/lib/docker/volumes/my-project_wp_data/_data/

      - name: 3. 執行本機 Nginx 與 Apache 路由重載
        run: |
          echo "🔄 執行 Nginx 與 Apache 容器重啟，全面刷新快取記憶..."
          cd /root/my-project
          sudo docker compose restart
          echo "🎉 [Success] 雙專案獨立路徑全新刷新完成！"
