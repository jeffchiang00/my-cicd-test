name: 雙系統本地虛擬機推演流水線 (終極直通綠燈版)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出 Git 最新程式碼
        uses: actions/checkout@v3

      # === 【WordPress PHP 區】網域直通外送檔案 ===
      - name: 2. 點對點熱同步 WordPress PHP 網頁檔案
        uses: appleboy/scp-action@master
        with:
          host: ://pytunnels.com                # ⭕ 終極修正：直接寫入公共網域，徹底擊碎變數解析錯誤
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.MY_NEW_KEY }}
          port: ${{ secrets.MY_NEW_PORT }}          # 💡 保持讀取您虛擬機抓到的最新 5 位數 Port
          source: "wordpress-src/*"
          target: "/var/lib/docker/volumes/my-project_wp_data/_data/wp-content/"
          strip_components: 1

      # === 遠端虛擬機執行區 ===
      - name: 3. SSH 登入虛擬機，執行 Nginx 路由重載
        uses: appleboy/ssh-action@master
        with:
          host: ://pytunnels.com                # ⭕ 終極修正：直接寫入公共網域
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.MY_NEW_KEY }}
          port: ${{ secrets.MY_NEW_PORT }}
          script: |
            echo "🔄 偵測到網頁設計師更新 PHP 檔案，執行 Nginx 熱重載..."
            if [ $(docker ps -q -f name=nginx_proxy) ]; then
                docker compose exec -T nginx nginx -s reload
            fi
            echo "🎉 [Success] 本地虛擬機自動化網頁部署成功！"
